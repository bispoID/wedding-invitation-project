<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#171b16" />
    <title>Nova senha | Administração</title>
    <link rel="icon" type="image/x-icon" href="../images/favicon_selo.ico" />
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="stylesheet" href="./styles/login.css" />
  </head>
  <body data-page="reset-password">
    <main class="admin-shell login-shell">
      <section class="admin-card login-card" aria-labelledby="reset-title">
        <p class="eyebrow">Área administrativa</p>
        <h1 id="reset-title">Nova senha</h1>
        <p class="login-intro" id="reset-description">Use pelo menos 6 caracteres. Prefira uma senha longa e exclusiva.</p>
        <p class="feedback" id="reset-feedback" role="status" aria-live="polite">Validando o link de recuperação...</p>
        <form inert class="login-form" id="reset-form" hidden>
          <label for="new-password">Nova senha</label>
          <input id="new-password" name="password" type="password" autocomplete="new-password" minlength="6" required />
          <label for="confirm-password">Confirme a nova senha</label>
          <input id="confirm-password" name="confirmation" type="password" autocomplete="new-password" minlength="6" required />
          <button class="button" id="reset-button" type="submit">Salvar nova senha</button>
        </form>
        <button class="button" id="reset-logout" type="button" hidden>Encerrar esta sessão</button>
        <a class="login-link" id="reset-login" href="./login.html?recovery=request">Voltar ao login / solicitar outro link</a>
      </section>
    </main>
    <script type="module" src="../scripts/shared/bootstrap.js"></script>
  </body>
</html>
