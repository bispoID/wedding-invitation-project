<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#171b16" />
    <title>Entrar | Administração</title>
    <link rel="icon" type="image/x-icon" href="../images/favicon_selo.ico" />
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="stylesheet" href="./styles/login.css" />
  </head>
  <body data-page="login">
    <main class="admin-shell login-shell">
      <section class="admin-card login-card" aria-labelledby="login-title">
        <p class="eyebrow">Área administrativa</p>
        <h1 id="login-title">Entrar</h1>
        <p class="login-intro" id="login-description">Acesse com o e-mail e a senha do administrador.</p>

        <div id="login-panel">
          <p class="feedback" id="login-loading" role="status">
            Verificando sua sessão...
          </p>
          <p class="feedback feedback--error" id="login-error" role="alert" hidden></p>
          <p class="feedback" id="login-success" role="status" hidden></p>

          <form inert class="login-form" id="login-form" hidden>
            <label for="email">E-mail</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="username"
              inputmode="email"
              required
            />

            <label for="password">Senha</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />

            <button class="button" id="login-button" type="submit">Entrar</button>
          </form>
          <button class="login-link" id="forgot-password" type="button" aria-expanded="false" aria-controls="recovery-panel" hidden>Esqueci minha senha</button>
        </div>
        <div id="recovery-panel" hidden inert>
          <form inert class="login-form" id="recovery-form">
            <label for="recovery-email">E-mail</label>
            <input id="recovery-email" name="email" type="email" autocomplete="email" inputmode="email" required />
            <button class="button" id="recovery-button" type="submit">Enviar instruções</button>
          </form>
          <p class="feedback" id="recovery-feedback" role="status" aria-live="polite" hidden></p>
          <button class="login-link" id="recovery-back" type="button" aria-controls="login-panel">Voltar para o login</button>
        </div>
      </section>
    </main>
    <script type="module" src="../scripts/shared/bootstrap.js"></script>
  </body>
</html>
