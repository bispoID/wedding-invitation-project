name: Deploy invite-app to GitHub Pages

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    if: github.ref == 'refs/heads/staging'
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  deploy:
    needs: validate
    # A execução manual também só pode publicar o ambiente de homologação.
    if: github.ref == 'refs/heads/staging'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"

      - name: Validate portable preparation
        run: node --test scripts/app-config.test.mjs scripts/prepare-static-site.test.mjs

      - name: Prepare site
        env:
          APP_ENV: uat
          SUPABASE_PROJECT_REF: ${{ vars.UAT_SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.UAT_SUPABASE_URL }}
          SUPABASE_PUBLIC_KEY: ${{ vars.UAT_SUPABASE_PUBLIC_KEY }}
          BUILD_ID: ${{ github.sha }}
          PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/prepare-pages-uat.mjs

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
