name: Deploy invite-app to GitHub Pages

on:
  push:
    branches:
      - feature/landing-page
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"

      - name: Validate portable preparation
        run: node --test scripts/app-config.test.mjs scripts/prepare-static-site.test.mjs

      - name: Prepare site
        env:
          PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/prepare-static-site.mjs

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
